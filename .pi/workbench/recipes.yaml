# pi-dev-workbench bootstrap recipes (P6-C deterministic action cache).
#
# Caching is OPT-IN per recipe and disabled by default. Only declared
# recipes can be cached; only successful results are cached; the action key
# is a content fingerprint of the DECLARED inputs (never git state, mtime
# or file sizes). See docs/cache/action-cache.md and
# docs/cache/recipe-cache-schema.md.
#
# Security rules enforced at parse time (violations disable caching for the
# recipe with a recorded warning, never the recipe itself):
#   - network / time / random / external-API recipes are not cacheable
#   - recipes whose declared writes modify source code are not cacheable
#   - `cache.outputs` (artifacts restore) is disabled in this version
#   - secret env values are hashed into the key, never stored
#
# Cache location (project-local, gitignored):
#   .pi/workbench/cache/{actions,cas,locks,tmp,cache-index.json}

recipes:
  - name: typecheck
    description: TypeScript typecheck (tsc --noEmit) — cached (result-only)
    command: [npm, run, typecheck]
    cwd: .
    timeout_ms: 300000
    allowed_modes: [DEV, VERIFY]
    expected_exit_codes: [0]
    writes: []
    mutation: none
    artifacts: []
    environment: []
    output_strategy: tail
    max_lines: 200
    max_bytes: 20480
    cache:
      enabled: true
      version: 1
      mode: result-only
      successOnly: true
      inputs:
        - package.json
        - package-lock.json
        - tsconfig.json
        - extensions/**/*.ts
        - tests/**/*.ts
        - prompts/**/*.md
        - skills/**/SKILL.md
        - templates/**
        - assets/**
        - tools/**
        - compatibility/**
        - docs/**/*.md
      outputs: []
      environment: []
      toolchain: [node, npm]
      maxAgeSeconds: null

  - name: unit-test
    description: Unit test suite (tsx --test tests/*.test.ts) — cached (result-only)
    command: [npm, test]
    cwd: .
    timeout_ms: 600000
    allowed_modes: [DEV, VERIFY]
    expected_exit_codes: [0]
    writes: []
    mutation: none
    artifacts: []
    environment: []
    output_strategy: tail
    max_lines: 300
    max_bytes: 30720
    cache:
      enabled: true
      version: 1
      mode: result-only
      successOnly: true
      inputs:
        - package.json
        - package-lock.json
        - tsconfig.json
        - README.md
        - CHANGELOG.md
        - LICENSE
        - .gitignore
        - extensions/**/*.ts
        - tests/**/*.ts
        - prompts/**/*.md
        - skills/**/SKILL.md
        - templates/**
        - assets/**
        - tools/**
        - compatibility/**
        - docs/**/*.md
      outputs: []
      environment: []
      toolchain: [node, npm]
      maxAgeSeconds: null

  # `check` runs typecheck + unit tests + `git diff --check` in one chain.
  # Its outcome depends on git working-tree state, which is deliberately NOT
  # part of any action key — so it stays UNCACHED in this version. Run the
  # cached typecheck/unit-test recipes for the fast path.
  - name: check
    description: Full check (typecheck + unit tests + whitespace) — intentionally not cached
    command: [npm, run, check]
    cwd: .
    timeout_ms: 900000
    allowed_modes: [DEV, VERIFY]
    expected_exit_codes: [0]
    writes: []
    mutation: none
    artifacts: []
    environment: []
    output_strategy: tail
    max_lines: 300
    max_bytes: 30720

  # P9 evidence preparation (commander-token-optimization plan, Slice E P9
  # prep) — offline, machine facts only. Takes exactly the eleven immutable
  # source Pi Session JSONL paths (eight disclosed invalid collection
  # attempts in fixed chronological order, then three corrected
  # final-current sessions), commits byte-exact copies plus the strict
  # manifest under `.pi/workbench/runs/` with exclusive-create semantics
  # (refuses existing/racing outputs, ownership-tracked rollback).
  # Artifact-only (mutation: artifacts) and intentionally UNCACHED — the
  # evidence directory and manifest are real outputs, never cache entries.
  - name: commander-token-p9-prepare
    description: P9 evidence preparation (offline, machine facts only) — byte-exact copies of the 11 disclosed sources + strict manifest; exclusive-create commit, refuses existing outputs
    command:
      - npm
      - run
      - commander:prepare
      - --
      - "{{invalid1}}"
      - "{{invalid2}}"
      - "{{invalid3}}"
      - "{{invalid4}}"
      - "{{invalid5}}"
      - "{{invalid6}}"
      - "{{invalid7}}"
      - "{{invalid8}}"
      - "{{current1}}"
      - "{{current2}}"
      - "{{current3}}"
    cwd: .
    timeout_ms: 600000
    allowed_modes: [DEV, VERIFY]
    expected_exit_codes: [0]
    writes:
      - .pi/workbench/runs/commander-token-p9-benchmark/**
      - .pi/workbench/runs/commander-token-p9-manifest.json
    mutation: artifacts
    artifacts:
      - .pi/workbench/runs/commander-token-p9-benchmark/**
      - .pi/workbench/runs/commander-token-p9-manifest.json
    environment: []
    output_strategy: tail
    max_lines: 200
    max_bytes: 20480
    params:
      - name: invalid1
        type: string
        required: true
        description: invalid-1 Pi Session JSONL source path
      - name: invalid2
        type: string
        required: true
        description: invalid-2 Pi Session JSONL source path
      - name: invalid3
        type: string
        required: true
        description: invalid-3 Pi Session JSONL source path
      - name: invalid4
        type: string
        required: true
        description: invalid-4 Pi Session JSONL source path
      - name: invalid5
        type: string
        required: true
        description: invalid-5 Pi Session JSONL source path
      - name: invalid6
        type: string
        required: true
        description: invalid-6 Pi Session JSONL source path
      - name: invalid7
        type: string
        required: true
        description: invalid-7 Pi Session JSONL source path
      - name: invalid8
        type: string
        required: true
        description: invalid-8 Pi Session JSONL source path
      - name: current1
        type: string
        required: true
        description: final-current-1 Pi Session JSONL source path
      - name: current2
        type: string
        required: true
        description: final-current-2 Pi Session JSONL source path
      - name: current3
        type: string
        required: true
        description: final-current-3 Pi Session JSONL source path

  # P9 benchmark analysis (offline analyzer) — fixed JSON invocation of the
  # manifest produced by commander-token-p9-prepare. Read-only: no writes,
  # no artifacts, mutation none; intentionally UNCACHED so every benchmark
  # run executes against the current evidence.
  - name: commander-token-p9-benchmark
    description: P9 benchmark analysis — offline analyzer over the prepared P9 manifest (fixed JSON invocation, read-only)
    command:
      - npm
      - run
      - commander:benchmark
      - --
      - .pi/workbench/runs/commander-token-p9-manifest.json
      - --json
    cwd: .
    timeout_ms: 300000
    allowed_modes: [DEV, VERIFY]
    expected_exit_codes: [0]
    writes: []
    mutation: none
    artifacts: []
    environment: []
    output_strategy: tail
    max_lines: 300
    max_bytes: 30720

  # NRO evidence preparation (native-tool benchmark) — offline, machine
  # facts only. Takes exactly one immutable chronological collection-record
  # path; the package script freezes the production inputs. Commits
  # byte-exact copies plus the strict manifest under `.pi/workbench/runs/`
  # with exclusive-create semantics (refuses existing/racing outputs).
  # Artifact-only (mutation: artifacts) and intentionally UNCACHED — the
  # evidence directory and manifest are real outputs, never cache entries.
  - name: commander-native-tool-benchmark-prepare
    description: NRO evidence preparation (offline, machine facts only) — byte-exact copies of the immutable chronological collection record + strict manifest; exclusive-create commit, refuses existing outputs
    command:
      - npm
      - run
      - commander:nro:prepare
      - --
      - --collection
      - "{{collection}}"
    cwd: .
    timeout_ms: 600000
    allowed_modes: [DEV, VERIFY]
    expected_exit_codes: [0]
    writes:
      - .pi/workbench/runs/commander-native-tool-benchmark/**
      - .pi/workbench/runs/commander-native-tool-benchmark-manifest.json
    mutation: artifacts
    artifacts:
      - .pi/workbench/runs/commander-native-tool-benchmark/**
      - .pi/workbench/runs/commander-native-tool-benchmark-manifest.json
    environment: []
    output_strategy: tail
    max_lines: 200
    max_bytes: 20480
    params:
      - name: collection
        type: string
        required: true
        description: the immutable chronological collection-record path

  # NRO benchmark analysis (offline analyzer) — fixed JSON invocation of the
  # manifest produced by commander-native-tool-benchmark-prepare. Read-only:
  # no writes, no artifacts, mutation none; intentionally UNCACHED so every
  # benchmark run executes against the current evidence.
  - name: commander-native-tool-benchmark
    description: NRO benchmark analysis — offline analyzer over the prepared NRO manifest (fixed JSON invocation, read-only)
    command:
      - npm
      - run
      - commander:nro:benchmark
    cwd: .
    timeout_ms: 300000
    allowed_modes: [DEV, VERIFY]
    expected_exit_codes: [0]
    writes: []
    mutation: none
    artifacts: []
    environment: []
    output_strategy: tail
    max_lines: 300
    max_bytes: 30720

  # NRO protocol-v2 evidence preparation (frozen v2 prepare) — offline,
