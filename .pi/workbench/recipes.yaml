  - name: commander-native-tool-benchmark-v2-prepare
    description: NRO protocol-v2 evidence preparation (offline, machine facts only) — byte-exact copies of the frozen v2 inputs + immutable collection record + strict v2 manifest; exclusive-create commit, refuses existing outputs
    command:
