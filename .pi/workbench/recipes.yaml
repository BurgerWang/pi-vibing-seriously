  # NRO protocol-v2 benchmark analysis (frozen v2 analyzer) — fixed JSON
  # invocation of the manifest produced by
  # commander-native-tool-benchmark-v2-prepare (the package script carries
  # the fixed v2 manifest path and --json). Read-only: no writes, no
  # artifacts, mutation none; intentionally UNCACHED so every benchmark run
  # executes against the current evidence.
  - name: commander-native-tool-benchmark-v2
    description: NRO protocol-v2 benchmark analysis — offline analyzer over the prepared v2 manifest (fixed JSON invocation, read-only)
    command:
      - npm
      - run
      - commander:nro:v2:benchmark
    cwd: .
    timeout_ms: 300000
    allowed_modes: [DEV, VERIFY]
    expected_exit_codes: [0]
    writes: []
    mutation: none
    artifacts: []
    environment: []
    output_strategy: tail
    max_lines: 300
    max_bytes: 30720

  # NRO DEV-pilot collection (reviewed pilot collector) — DEV-ONLY recipe.
  # Performs PAID external provider/model calls: the pilot may make up to
  # 12 attempts. Pilot artifacts are NEVER final/adoption evidence — they
  # must not be used for acceptance, gates, or any final decision; only the
  # reviewed production collection is adoption evidence. Intentionally
  # UNCACHED (no cache block): every run executes live paid calls.
  # Exit 0 = complete 8-valid pilot; exit 1 = truthful capped partial/
  # runtime artifact. Writes exclusively under the pilot collection root
  # (no staging globs).
  - name: commander-native-tool-dev-pilot-collect
    description: DEV-only NRO pilot collection — performs PAID external provider/model calls (up to 12 attempts); pilot artifacts are never final/adoption evidence; intentionally uncached
    command:
      - npm
      - run
      - commander:nro:pilot
    cwd: .
    timeout_ms: 7200000
    allowed_modes: [DEV]
    expected_exit_codes: [0, 1]
    writes:
      - .pi/workbench/runs/commander-native-tool-dev-pilot-collection/**
    mutation: artifacts
    artifacts:
      - .pi/workbench/runs/commander-native-tool-dev-pilot-collection/**
    environment: []
    output_strategy: tail
    max_lines: 100
    max_bytes: 20480

  # NRO FINAL validation collection (reviewed FINAL collector) — DEV-ONLY
  # recipe. Performs PAID external provider/model calls: fixed 40 valid
  # final sessions (ABBA repeated 10 times, 20 per arm), max 60
  # successfully-started paid attempts, final evidence only, and requires
  # a separate explicit user authorization before any run. Intentionally
  # UNCACHED (no cache block): every run executes live paid calls.
  # Exit 0 = complete 40-valid collection; exit 1 = truthful capped
  # partial / runtime hard-fail. Writes exclusively under the final
  # collection root (no staging globs).
  - name: commander-native-tool-final-collect
    description: DEV-only NRO FINAL collection — performs PAID external provider/model calls (fixed 40 valid final sessions, ABBAx10, 20 per arm, max 60 successfully-started paid attempts, final evidence only); requires separate explicit user authorization; intentionally uncached
    command:
      - npm
      - run
      - commander:nro:final
    cwd: .
    timeout_ms: 112500000
    allowed_modes: [DEV]
    expected_exit_codes: [0, 1]
    writes:
      - .pi/workbench/runs/commander-native-tool-final-collection/**
    mutation: artifacts
    artifacts:
      - .pi/workbench/runs/commander-native-tool-final-collection/**
    environment: []
    output_strategy: tail
    max_lines: 100
    max_bytes: 20480

