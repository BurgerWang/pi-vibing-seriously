# Workbench gates (P3: enforced by the Gate Engine).
#
# The built-in ladder loads automatically for quant-research profiles:
#   base gates (every profile):
#     b0 Project Readiness            b3 Integration Correctness
#     b1 Static Quality               b4 Output Contract
#     b2 Unit Correctness             b5 Reproducibility and Handoff
#   quant gates (quant profiles only):
#     q0 Research Contract            q3 Experiment Integrity
#     q1 Market Data Integrity        q4 Out-of-Sample Robustness
#     q2 Backtest Semantics           q5 Strategy Reporting
#
# Quant checks validate the project's DECLARED output — the workbench never
# computes strategy metrics. Conventions used by the built-in checks:
#   research/contract.json           — Q0 research contract
#   results/quant-result.json        — quant output contract
#                                      (quant-result.schema.json)
#   recipes: data:fetch, backtest (backtest:selection / backtest:timing are
#            accepted as alternatives), check:*, test:unit, test:integration
# Audits that cannot be machine-verified (look-ahead, survivorship, ...) are
# manual-evidence checks: they only PASS with explicit manual evidence
# (recorded as type "manual" in evidence.json — never from model prose).
#
# P6-D quant cache contracts (optional; the workbench defines, validates and
# connects them — it never downloads data, computes features or runs a
# backtest engine). Convention: the quant recipes write manifest JSON files
# under artifacts/, and gates can validate them with kind: schema:
#   artifacts/data-snapshot.json     — schema: data-snapshot  (Q1)
#   artifacts/feature-set.json       — schema: feature-set    (Q1/Q2)
#   artifacts/backtest-result.json   — schema: backtest-result (Q2-Q5)
# A schema check only PASSES when the manifest is fully validated
# (structure + semantics + immutable). Manifests that merely parse (missing
# adjustment/corporate-action/delisting semantics, mutable ids, unresolved
# logical references, walk-forward without folds, best-trial-only) FAIL.
# Cache hits never bypass Q0-Q5: every gate re-validates every run, cached
# or not.
#
# Override built-in gates by id or add new gates here, e.g.:
#   gates:
#     - id: q4
#       title: Out-of-Sample Robustness
#       checks:
#         - { id: q4.2, title: Multi-fold OOS, kind: numeric,
#             file: results/quant-result.json, path: folds.length, min: 3 }
# A project gate with a built-in id replaces the built-in entirely.
gates: []
